                    <div class="color-card-header" data-action="toggle-color" data-color-id="${c.id}">
                        <div class="card-header-top">
                            <div class="entity-name-wrap">${nameHtml}</div>
                            <span class="toggle-icon ${isOpen ? '' : 'collapsed'}"><i class="fas fa-caret-down"></i></span>
                        </div>
                        <div class="card-header-stats">
                            <span class="badge-total">Net: ${totalNet}</span>
                        </div>
                    </div>
                    <div class="collapsible-body ${isOpen ? 'open' : ''}" id="cbody-color-${c.id}">
                        <div class="parts-container">
                            ${partsHtml}
                            <button class="btn-add-inline" data-action="add-part" data-color-id="${c.id}"><i class="fas fa-plus"></i> Parça Ekle</button>
                        </div>
                    </div>
                </div>`;
            }

            function renderPartCard(colorId, p, sizesModel) {
                const isOpen = !!openParts[p.id];
                const editingKey = 'part:' + p.id;
                const totalNet = partNetTotal(p);

                const nameHtml = editing[editingKey]
                    ? `<input type="text" class="inline-edit-input" data-type="part" data-color-id="${colorId}" data-part-id="${p.id}" value="${escapeHtml(p.name)}" placeholder="PARÇA ADI" maxlength="50">
                       <button class="edit-name-btn confirm-btn" data-action="confirm-name" data-type="part" data-color-id="${colorId}" data-part-id="${p.id}" title="Onayla"><i class="fas fa-check"></i></button>`
                    : `<span class="entity-name">${escapeHtml(p.name) || 'İSİMSİZ PARÇA'}</span>
                       <button class="edit-name-btn" data-action="edit" data-type="part" data-color-id="${colorId}" data-part-id="${p.id}" title="Düzenle"><i class="fas fa-pen"></i></button>`;

                const sizesHtml = sizesModel.map(s => renderSizeCard(colorId, p.id, s)).join('');
                const anySizeOpen = sizesModel.some(s => !!openSizes[s.id]);
                const addSizeBtnHtml = anySizeOpen ? '' : `<button class="btn-add-inline" data-action="add-size" data-color-id="${colorId}" data-part-id="${p.id}"><i class="fas fa-plus"></i> Ebat Ekle</button>`;

                return `
                <div class="part-card" data-part-id="${p.id}">
                    <button class="delete-corner-btn dc-part" data-action="delete" data-type="part" data-color-id="${colorId}" data-part-id="${p.id}" title="Parçayı Sil"><svg viewBox="0 0 24 24" width="12" height="12"><line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="20" y1="4" x2="4" y2="20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
                    <div class="part-card-header" data-action="toggle-part" data-color-id="${colorId}" data-part-id="${p.id}">
                        <div class="card-header-top">
                            <div class="entity-name-wrap">${nameHtml}</div>
                            <span class="toggle-icon ${isOpen ? '' : 'collapsed'}"><i class="fas fa-caret-down"></i></span>
                        </div>
                        <div class="card-header-stats">
                            <span class="badge-total">Net: ${totalNet}</span>
                        </div>
                    </div>
                    <div class="collapsible-body ${isOpen ? 'open' : ''}" id="cbody-part-${p.id}">
                        <div class="sizes-container">
                            ${sizesHtml}
                            ${addSizeBtnHtml}
                        </div>
                    </div>
                </div>`;
            }

            function renderSizeCard(colorId, partId, s) {
                const isOpen = !!openSizes[s.id];
                const editingKey = 'size:' + s.id;
                const last18 = lastQtyForThickness(s, 18);
                const last30 = lastQtyForThickness(s, 30);
                const n18 = net18(s), n30 = net30(s);
                const isIncoming = currentMode === 'incoming';
                // Butonlar (miktar girme): Ekle modunda her zaman görünür (0'a düşse de stok girilebilsin), Çıkart modunda 0 ise gizli.
                const show18 = isIncoming || n18 > 0;
                const show30 = isIncoming || n30 > 0;
                const onlyOneShown = show18 !== show30;
                // Rozetler (sadece bilgi amaçlı label'lar): moddan bağımsız, 0 ise her zaman gizli.
                const badgeShow18 = n18 > 0;
                const badgeShow30 = n30 > 0;
                const onlyOneBadgeShown = badgeShow18 !== badgeShow30;

                const nameHtml = editing[editingKey]
                    ? `<input type="text" class="inline-edit-input" data-type="size" data-color-id="${colorId}" data-part-id="${partId}" data-size-id="${s.id}" value="${escapeHtml(s.name)}" placeholder="EBAT (örn: 398X472)" maxlength="30">
                       <button class="edit-name-btn confirm-btn" data-action="confirm-name" data-type="size" data-color-id="${colorId}" data-part-id="${partId}" data-size-id="${s.id}" title="Onayla"><i class="fas fa-check"></i></button>`
                    : `<span class="entity-name">${escapeHtml(s.name) || 'İSİMSİZ EBAT'}</span>
                       <button class="edit-name-btn" data-action="edit" data-type="size" data-color-id="${colorId}" data-part-id="${partId}" data-size-id="${s.id}" title="Düzenle"><i class="fas fa-pen"></i></button>`;

                const statsHtml = (badgeShow18 || badgeShow30) ? `
                        <div class="card-header-stats ${onlyOneBadgeShown ? 'stats-center' : ''}">
                            ${badgeShow18 ? `<span class="badge-total">18mm: ${n18}</span>` : ''}
                            ${badgeShow30 ? `<span class="badge-total">30mm: ${n30}</span>` : ''}
                        </div>` : '';

                const thicknessRowHtml = (show18 || show30) ? `
                            <div class="thickness-select-row ${onlyOneShown ? 'single' : ''}">
                                ${show18 ? `<button class="thickness-select-btn" data-action="open-qty-modal" data-color-id="${colorId}" data-part-id="${partId}" data-size-id="${s.id}" data-thickness="18">
                                    <span class="thickness-select-title">18mm</span>
                                    <span class="thickness-select-sub">Stok: ${n18} · Son: ${last18 !== null ? last18 : '—'}</span>
                                </button>` : ''}
                                ${show30 ? `<button class="thickness-select-btn" data-action="open-qty-modal" data-color-id="${colorId}" data-part-id="${partId}" data-size-id="${s.id}" data-thickness="30">
                                    <span class="thickness-select-title">30mm</span>
                                    <span class="thickness-select-sub">Stok: ${n30} · Son: ${last30 !== null ? last30 : '—'}</span>
                                </button>` : ''}
                            </div>` : `<div class="thickness-empty-hint">Bu modda gösterilecek stok yok. Stok eklemek için "Ekle" moduna geçin.</div>`;

                return `
                <div class="size-card" data-size-id="${s.id}">
                    <button class="delete-corner-btn dc-size" data-action="delete" data-type="size" data-color-id="${colorId}" data-part-id="${partId}" data-size-id="${s.id}" title="Ebatı Sil"><svg viewBox="0 0 24 24" width="12" height="12"><line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="20" y1="4" x2="4" y2="20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
                    <div class="size-card-header" data-action="toggle-size" data-color-id="${colorId}" data-part-id="${partId}" data-size-id="${s.id}">
                        <div class="card-header-top">
                            <div class="entity-name-wrap">${nameHtml}</div>
                            <button class="note-btn ${s.note ? 'has-note' : ''}" data-action="open-note" data-color-id="${colorId}" data-part-id="${partId}" data-size-id="${s.id}" title="${s.note ? 'Açıklamayı Düzenle' : 'Açıklama Ekle'}"><i class="fas fa-comment-dots"></i></button>
                            <span class="toggle-icon ${isOpen ? '' : 'collapsed'}"><i class="fas fa-caret-down"></i></span>
                        </div>
                        ${statsHtml}
                        ${s.note ? `<div class="note-preview" title="${escapeHtml(s.note)}">${escapeHtml(s.note)}</div>` : ''}
                    </div>
                    <div class="collapsible-body ${isOpen ? 'open' : ''}" id="cbody-size-${s.id}">
                        <div class="size-detail">
                            ${thicknessRowHtml}
                            <button class="btn-mini-action history-mini" data-action="history" data-color-id="${colorId}" data-part-id="${partId}" data-size-id="${s.id}"><i class="fas fa-history"></i> Geçmişi Görüntüle</button>
                        </div>
                    </div>
                </div>`;
            }

            // ---------- GENEL BAKIŞ MODAL ----------
            function renderOverviewModal() {
                const body = document.getElementById('listModalBody');
                const map = {};
                inventory.forEach(c => c.parts.forEach(p => {
                    const key = (p.name || '').toLocaleUpperCase('tr-TR');
                    if (!key) return;
                    if (!map[key]) map[key] = [];
                    p.sizes.forEach(s => {
                        map[key].push({ colorName: c.name || 'İsimsiz Renk', sizeName: s.name || 'İsimsiz Ebat', net18: net18(s), net30: net30(s), note: s.note || '' });
                    });
                }));
                const names = Object.keys(map).sort();
                if (!names.length) { body.innerHTML = '<p class="text-muted text-center py-4">Henüz parça eklenmemiş.</p>'; return; }
                body.innerHTML = names.map((name, i) => `
                    <div class="list-color-item">
                        <div class="list-color-header" data-list-index="${i}">
                            <span><i class="fas fa-cube me-2"></i>${escapeHtml(name)}</span>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="list-color-body" id="listBody-${i}">
                            ${map[name].map(row => {
                                const show18 = row.net18 > 0, show30 = row.net30 > 0;
                                const singleClass = (show18 !== show30) ? 'single' : '';
                                let qtyHtml = '';
                                if (show18 || show30) {
                                    qtyHtml = `<div class="list-part-qty ${singleClass}">${show18 ? `<span>18mm: ${row.net18}</span>` : ''}${show30 ? `<span>30mm: ${row.net30}</span>` : ''}</div>`;
                                }
                                const noteHtml = row.note ? `<div class="note-preview-list" title="${escapeHtml(row.note)}">${escapeHtml(row.note)}</div>` : '';
                                return `
                                <div class="list-part-item">
                                    <div class="list-part-info">
                                        <div class="list-part-title">${escapeHtml(row.colorName)} — ${escapeHtml(row.sizeName)}</div>
                                        ${noteHtml}
                                    </div>
                                    ${qtyHtml}
                                </div>`;
                            }).join('')}
                        </div>
                    </div>`).join('');

                document.querySelectorAll('.list-color-header').forEach(header => {
                    header.addEventListener('click', function () {
                        const idx = this.getAttribute('data-list-index');
                        const b = document.getElementById('listBody-' + idx);
                        const icon = this.querySelector('.fa-chevron-down');
                        b.classList.toggle('open');
                        icon.style.transform = b.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
                    });
                });
            }

            // ---------- DIŞA / İÇE AKTARMA ----------
            function downloadFile(blob, filename) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = filename;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            function exportData() {
                const blob = new Blob([JSON.stringify(inventory, null, 2)], { type: 'application/json' });
                downloadFile(blob, 'mobilya_stok_yedek_' + new Date().toISOString().slice(0, 10) + '.json');
                showToast('Veriler JSON dosyası olarak indirildi.');
            }
            function importData(file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!Array.isArray(data)) throw new Error('Geçersiz dosya formatı.');
                        inventory = isLegacyFormat(data) ? migrateLegacy(data) : normalizeInventory(data);
                        saveToFirebase(); render();
                        showToast('Veriler başarıyla içe aktarıldı.');
                    } catch (err) { showToast('İçe aktarma hatası: ' + err.message, 'danger'); }
                };
                reader.readAsText(file);
            }
            function fmtNet(n) { return n === 0 ? '-' : n; }
            function trSort(a, b) { return (a || '').localeCompare(b || '', 'tr'); }

            async function exportExcel() {
                const sortedColors = [...inventory].sort((a, b) => trSort(a.name, b.name));
                const HEADER_FILL = 'FFDCE6F1';
                const HEADER_FONT = 'FF1E3A5F';
                const BAND_FILL = 'FFF2F2F2';

                const wb = new ExcelJS.Workbook();
                wb.creator = 'Mobilya Parça Stok Takibi';
                wb.created = new Date();

                // --- Sayfa 1: Stok Listesi (birleştirilmiş hücreler, ortalanmış, kenarlıklı) ---
                const ws1 = wb.addWorksheet('Stok Listesi', { views: [{ state: 'frozen', ySplit: 1 }] });
                ws1.columns = [
                    { header: 'Renk', width: 22 },
                    { header: 'Parça', width: 20 },
                    { header: 'Ebat', width: 16 },
                    { header: '18mm Net Stok', width: 15 },
                    { header: '30mm Net Stok', width: 15 }
                ];
                const headerRow1 = ws1.getRow(1);
                headerRow1.height = 26;
                headerRow1.eachCell(cell => {
                    cell.font = { bold: true, size: 12, color: { argb: HEADER_FONT } };
                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: HEADER_FILL } };
                    cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
                    cell.border = { top: { style: 'medium' }, bottom: { style: 'medium' }, left: { style: 'medium' }, right: { style: 'medium' } };
                });

                let band = false;
                let rowCursor = 2;
                sortedColors.forEach(c => {
                    const sortedParts = [...c.parts].sort((a, b) => trSort(a.name, b.name)).filter(p => p.sizes.length);
                    if (!sortedParts.length) return;
                    const colorStartRow = rowCursor;
                    sortedParts.forEach(p => {
                        const sortedSizes = [...p.sizes].sort((a, b) => trSort(a.name, b.name));
                        const partStartRow = rowCursor;
                        band = !band;
                        sortedSizes.forEach(s => {
                            const row = ws1.addRow([c.name || 'İsimsiz Renk', p.name || 'İsimsiz Parça', s.name || 'İsimsiz Ebat', fmtNet(net18(s)), fmtNet(net30(s))]);
                            row.eachCell(cell => {
                                cell.alignment = { horizontal: 'center', vertical: 'middle' };
                                cell.border = { top: { style: 'thin' }, bottom: { style: 'thin' }, left: { style: 'thin' }, right: { style: 'thin' } };
                                if (band) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: BAND_FILL } };
                            });
                            rowCursor++;
                        });
                        const partEndRow = rowCursor - 1;
                        if (partEndRow > partStartRow) ws1.mergeCells(`B${partStartRow}:B${partEndRow}`);
                    });
                    const colorEndRow = rowCursor - 1;
                    if (colorEndRow > colorStartRow) ws1.mergeCells(`A${colorStartRow}:A${colorEndRow}`);
                });

                if (rowCursor === 2) { showToast('Excel için veri bulunamadı.', 'warning'); return; }

                // --- Sayfa 2: Detaylı Giriş/Çıkış Dökümü ---
                const ws2 = wb.addWorksheet('Detaylı Döküm', { views: [{ state: 'frozen', ySplit: 1 }] });
                ws2.columns = [
                    { header: 'Renk', width: 22 }, { header: 'Parça', width: 20 }, { header: 'Ebat', width: 16 },
                    { header: '18mm Giriş', width: 12 }, { header: '18mm Çıkış', width: 12 }, { header: '18mm Net', width: 12 },
                    { header: '30mm Giriş', width: 12 }, { header: '30mm Çıkış', width: 12 }, { header: '30mm Net', width: 12 }
                ];
                const headerRow2 = ws2.getRow(1);
                headerRow2.height = 24;
                headerRow2.eachCell(cell => {
                    cell.font = { bold: true, size: 11, color: { argb: HEADER_FONT } };
                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: HEADER_FILL } };
                    cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
                    cell.border = { top: { style: 'medium' }, bottom: { style: 'medium' }, left: { style: 'medium' }, right: { style: 'medium' } };
                });
                sortedColors.forEach(c => {
                    [...c.parts].sort((a, b) => trSort(a.name, b.name)).forEach(p => {
                        [...p.sizes].sort((a, b) => trSort(a.name, b.name)).forEach(s => {
                            const row = ws2.addRow([
                                c.name || 'İsimsiz Renk', p.name || 'İsimsiz Parça', s.name || 'İsimsiz Ebat',
                                s.incoming18 || 0, s.outgoing18 || 0, net18(s),
                                s.incoming30 || 0, s.outgoing30 || 0, net30(s)
                            ]);
                            row.eachCell(cell => {
                                cell.alignment = { horizontal: 'center', vertical: 'middle' };
                                cell.border = { top: { style: 'thin' }, bottom: { style: 'thin' }, left: { style: 'thin' }, right: { style: 'thin' } };
                            });
                        });
                    });
                });

                const buffer = await wb.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                downloadFile(blob, 'mobilya_stok_' + new Date().toISOString().slice(0, 10) + '.xlsx');
                showToast('Excel dosyası indirildi.');
            }

            // ---------- MOD DEĞİŞTİRME (3 adımlı güvenlik onayı) ----------
            function requestModeChange(targetMode) {
                if (targetMode === currentMode) return;
                pendingModeChange = targetMode; modeChangeStep = 0;
                updateModeChangeModal();
                new bootstrap.Modal(document.getElementById('modeChangeModal')).show();
            }
            function updateModeChangeModal() {
                const cur = currentMode === 'incoming' ? 'Ekle' : 'Çıkart';
                const target = pendingModeChange === 'incoming' ? 'Ekle' : 'Çıkart';
                document.getElementById('modeChangeMessage').textContent = `Mod değiştirilecek: ${cur} → ${target}. Emin misiniz?`;
                document.getElementById('modeChangeStepText').textContent = '';
            }
            function confirmModeChangeStep() {
                if (!pendingModeChange) return;
                currentMode = pendingModeChange; pendingModeChange = null; modeChangeStep = 0;
                updateModeButtons(); render();
                const modal = bootstrap.Modal.getInstance(document.getElementById('modeChangeModal'));
                if (modal) modal.hide();
                showToast('Mod değiştirildi: ' + (currentMode === 'incoming' ? 'Ekle' : 'Çıkart'), 'success');
            }
            function cancelModeChange() {
                pendingModeChange = null; modeChangeStep = 0;
                const modal = bootstrap.Modal.getInstance(document.getElementById('modeChangeModal'));
                if (modal) modal.hide();
            }
            function updateModeButtons() {
                const inc = document.getElementById('modeIncomingBtn'), out = document.getElementById('modeOutgoingBtn');
                if (currentMode === 'incoming') { inc.classList.add('active-incoming'); out.classList.remove('active-outgoing'); }
                else { out.classList.add('active-outgoing'); inc.classList.remove('active-incoming'); }
            }

            // ---------- OLAY YÖNETİMİ ----------
            function attachDelegatedEvents() {
                const list = document.getElementById('colorsList');

                list.addEventListener('click', function (e) {
                    // Input üzerine tıklamak herhangi bir kart aksiyonunu (aç/kapa vb.) TETİKLEMESİN
                    if (e.target.tagName === 'INPUT') return;

                    // Açıklama etiketine tıklayınca genişlet/daralt (kart aç/kapa tetiklenmesin)
                    const notePreview = e.target.closest('.note-preview');
                    document.querySelectorAll('#colorsList .note-preview.expanded').forEach(el => {
                        if (el !== notePreview) el.classList.remove('expanded');
                    });
                    if (notePreview) { e.stopPropagation(); notePreview.classList.toggle('expanded'); return; }

                    const actionEl = e.target.closest('[data-action]');
                    if (!actionEl) return;
                    const action = actionEl.getAttribute('data-action');
                    const colorId = actionEl.getAttribute('data-color-id');
                    const partId = actionEl.getAttribute('data-part-id');
                    const sizeId = actionEl.getAttribute('data-size-id');

                    if (action === 'toggle-color') {
                        const willOpen = !openColors[colorId];
                        openColors[colorId] = willOpen;
                        if (!willOpen) { const c = findColor(colorId); if (c) closePartsAndSizesUnderColor(c); }
                        lastToggledBodyId = 'cbody-color-' + colorId;
                        render(); return;
                    }
                    if (action === 'toggle-part') {
                        e.stopPropagation();
                        const willOpen = !openParts[partId];
                        openParts[partId] = willOpen;
                        if (!willOpen) { const p = findPart(colorId, partId); if (p) closeSizesUnderPart(p); }
                        lastToggledBodyId = 'cbody-part-' + partId;
                        render(); return;
                    }
                    if (action === 'toggle-size') {
                        e.stopPropagation();
                        openSizes[sizeId] = !openSizes[sizeId];
                        lastToggledBodyId = 'cbody-size-' + sizeId;
                        render(); return;
                    }
                    if (action === 'edit') { e.stopPropagation(); startEdit(actionEl.getAttribute('data-type'), colorId, partId, sizeId); return; }
                    if (action === 'confirm-name') {
                        e.stopPropagation();
                        const type = actionEl.getAttribute('data-type');
                        const wrap = actionEl.closest('.entity-name-wrap');
                        const input = wrap.querySelector('.inline-edit-input');
                        saveNameEdit(type, colorId, partId, sizeId, input ? input.value : '');
                        return;
                    }
                    if (action === 'delete') { e.stopPropagation(); requestDelete(actionEl.getAttribute('data-type'), colorId, partId, sizeId); return; }
                    if (action === 'add-part') { e.stopPropagation(); addPart(colorId); return; }
                    if (action === 'add-size') { e.stopPropagation(); addSize(colorId, partId); return; }
                    if (action === 'open-qty-modal') {
                        e.stopPropagation();
                        openQtyModal(colorId, partId, sizeId, parseInt(actionEl.getAttribute('data-thickness'), 10));
                        return;
                    }
                    if (action === 'open-note') { e.stopPropagation(); openNoteModal(colorId, partId, sizeId); return; }
                    if (action === 'history') {
                        e.stopPropagation();
                        historyContext = { colorId, partId, sizeId };
                        renderHistoryModal();
                        new bootstrap.Modal(document.getElementById('historyModal')).show();
                        return;
                    }
                });

                list.addEventListener('input', function (e) {
                    if (e.target.classList.contains('inline-edit-input')) {
                        const start = e.target.selectionStart, end = e.target.selectionEnd;
                        e.target.value = e.target.value.toLocaleUpperCase('tr-TR');
                        e.target.setSelectionRange(start, end);
                    }
                });
                list.addEventListener('keypress', function (e) {
                    if (e.target.classList.contains('inline-edit-input') && e.key === 'Enter') {
                        e.preventDefault();
                        const type = e.target.getAttribute('data-type');
                        saveNameEdit(type, e.target.getAttribute('data-color-id'), e.target.getAttribute('data-part-id'), e.target.getAttribute('data-size-id'), e.target.value);
                    }
                });

                // ---- Ebat (tek ebat) Geçmiş penceresi ----
                const historyContentEl = document.getElementById('historyContent');
                historyContentEl.addEventListener('focusin', function (e) {
                    if (e.target.classList.contains('history-qty-edit')) e.target.select();
                });
                historyContentEl.addEventListener('focusout', function (e) {
                    if (!e.target.classList.contains('history-qty-edit')) return;
                    const item = e.target.closest('.history-item'); if (!item) return;
                    const entryId = item.getAttribute('data-entry-id');
                    editHistoryQty(historyContext.colorId, historyContext.partId, historyContext.sizeId, entryId, e.target.value);
                });
                historyContentEl.addEventListener('change', function (e) {
                    if (!e.target.classList.contains('history-datetime-edit')) return;
                    const item = e.target.closest('.history-item'); if (!item) return;
                    const entryId = item.getAttribute('data-entry-id');
                    editHistoryTimestamp(historyContext.colorId, historyContext.partId, historyContext.sizeId, entryId, e.target.value);
                });
                historyContentEl.addEventListener('click', function (e) {
                    const item = e.target.closest('.history-item'); if (!item) return;
                    const entryId = item.getAttribute('data-entry-id');
                    const moveBtn = e.target.closest('[data-move]');
                    if (moveBtn) { moveHistoryEntry(historyContext.colorId, historyContext.partId, historyContext.sizeId, entryId, moveBtn.getAttribute('data-move')); return; }
                    if (e.target.closest('.history-delete-btn')) { requestDeleteHistoryEntry(entryId, 'size'); return; }
                });
                historyContentEl.addEventListener('keypress', function (e) {
                    if (e.target.classList.contains('history-qty-edit') && e.key === 'Enter') e.target.blur();
                });

                // ---- Genel (Tüm İşlemler) Geçmiş penceresi ----
                const globalHistoryContentEl = document.getElementById('globalHistoryContent');
                globalHistoryContentEl.addEventListener('focusin', function (e) {
                    if (e.target.classList.contains('history-qty-edit')) e.target.select();
                });
                globalHistoryContentEl.addEventListener('focusout', function (e) {
                    if (!e.target.classList.contains('history-qty-edit')) return;
                    const item = e.target.closest('.history-item'); if (!item) return;
                    const entryId = item.getAttribute('data-entry-id');
                    const colorId = item.getAttribute('data-color-id') || null;
                    const partId = item.getAttribute('data-part-id') || null;
                    const sizeId = item.getAttribute('data-size-id') || null;
                    const archived = item.getAttribute('data-archived') === '1';
                    if (archived) editArchiveEntryQty(entryId, e.target.value);
                    else editGlobalHistoryQty(colorId, partId, sizeId, entryId, e.target.value);
                });
                globalHistoryContentEl.addEventListener('change', function (e) {
                    if (!e.target.classList.contains('history-datetime-edit')) return;
                    const item = e.target.closest('.history-item'); if (!item) return;
                    const entryId = item.getAttribute('data-entry-id');
                    const colorId = item.getAttribute('data-color-id') || null;
                    const partId = item.getAttribute('data-part-id') || null;
                    const sizeId = item.getAttribute('data-size-id') || null;
                    const archived = item.getAttribute('data-archived') === '1';
                    if (archived) editArchiveEntryTimestamp(entryId, e.target.value);
                    else editGlobalHistoryTimestamp(colorId, partId, sizeId, entryId, e.target.value);
                });
                globalHistoryContentEl.addEventListener('click', function (e) {
                    const item = e.target.closest('.history-item'); if (!item) return;
                    const entryId = item.getAttribute('data-entry-id');
                    const colorId = item.getAttribute('data-color-id') || null;
                    const partId = item.getAttribute('data-part-id') || null;
                    const sizeId = item.getAttribute('data-size-id') || null;
                    const archived = item.getAttribute('data-archived') === '1';
                    const moveBtn = e.target.closest('[data-move]');
                    if (moveBtn) { moveGlobalHistoryEntry(entryId, moveBtn.getAttribute('data-move')); return; }
                    if (e.target.closest('.history-delete-btn')) { requestDeleteGlobalEntry(entryId, archived, colorId, partId, sizeId); return; }
                });
                globalHistoryContentEl.addEventListener('keypress', function (e) {
                    if (e.target.classList.contains('history-qty-edit') && e.key === 'Enter') e.target.blur();
                });
            }

            // ---------- BAŞLATMA ----------
            function init() {
                initFirebaseListener();
                initArchiveListener();
                attachDelegatedEvents();
                updateModeButtons();

                // Tüm Bootstrap modalları için otomatik arka plan kaydırma kilidi
                document.addEventListener('show.bs.modal', lockBodyScroll);
                document.addEventListener('hidden.bs.modal', unlockBodyScroll);

                document.getElementById('modeIncomingBtn').addEventListener('click', () => { if (currentMode !== 'incoming') requestModeChange('incoming'); });
                document.getElementById('modeOutgoingBtn').addEventListener('click', () => { if (currentMode !== 'outgoing') requestModeChange('outgoing'); });
                document.getElementById('confirmModeChangeBtn').addEventListener('click', confirmModeChangeStep);
                document.getElementById('cancelModeChangeBtn').addEventListener('click', cancelModeChange);
                document.getElementById('confirmDeleteBtn').addEventListener('click', performDelete);
                document.getElementById('qtyModalConfirmBtn').addEventListener('click', confirmQtyModal);
                document.getElementById('noteModalSaveBtn').addEventListener('click', saveNoteModal);
                document.getElementById('noteModalTextarea').addEventListener('input', function () {
                    const start = this.selectionStart, end = this.selectionEnd;
                    this.value = this.value.toLocaleUpperCase('tr-TR');
                    this.setSelectionRange(start, end);
                });

                document.getElementById('addColorTopBtn').addEventListener('click', addColor);

                const searchToggleBtn = document.getElementById('searchToggleBtn');
                const searchInput = document.getElementById('searchInput');
                const mainToolbar = document.getElementById('mainToolbar');
                const toolbarExtraButtons = document.getElementById('toolbarExtraButtons');

                function flipToolbarButtons(changeFn) {
                    const first = toolbarExtraButtons.getBoundingClientRect();
                    const toolbarFirstHeight = mainToolbar.getBoundingClientRect().height;
                    changeFn();
                    const last = toolbarExtraButtons.getBoundingClientRect();
                    const toolbarLastHeight = mainToolbar.getBoundingClientRect().height;
                    const dy = first.top - last.top;

                    // Beyaz panelin yüksekliğini de butonlarla AYNI sürede animasyonla değiştir,
                    // panel butonlardan önce daralmasın/uzamasın diye.
                    if (toolbarFirstHeight !== toolbarLastHeight) {
                        mainToolbar.style.transition = 'none';
                        mainToolbar.style.height = toolbarFirstHeight + 'px';
                        mainToolbar.style.overflow = 'hidden';
                        void mainToolbar.offsetHeight; // reflow'u zorla
                        mainToolbar.style.transition = 'height 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
                        mainToolbar.style.height = toolbarLastHeight + 'px';
                        mainToolbar.addEventListener('transitionend', function cleanup(e) {
                            if (e.propertyName !== 'height') return;
                            mainToolbar.style.height = '';
                            mainToolbar.style.overflow = '';
                            mainToolbar.style.transition = '';
                            mainToolbar.removeEventListener('transitionend', cleanup);
                        });
                    }

                    if (dy === 0) return;
                    toolbarExtraButtons.style.transition = 'none';
                    toolbarExtraButtons.style.transform = `translateY(${dy}px)`;
                    void toolbarExtraButtons.offsetHeight; // reflow'u zorla
                    toolbarExtraButtons.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
                    toolbarExtraButtons.style.transform = '';
                }

                searchToggleBtn.addEventListener('click', function () {
                    if (searchInput.classList.contains('search-input-hidden')) {
                        flipToolbarButtons(() => {
                            searchInput.classList.remove('search-input-hidden');
                            mainToolbar.classList.add('search-open');
                        });
                        setTimeout(() => searchInput.focus(), 120);
                    } else {
                        flipToolbarButtons(() => {
                            searchInput.classList.add('search-input-hidden');
                            mainToolbar.classList.remove('search-open');
                        });
                        searchInput.value = ''; searchTerm = ''; render();
                    }
                });
                searchInput.addEventListener('input', function () {
                    const start = this.selectionStart, end = this.selectionEnd;
                    this.value = this.value.toLocaleUpperCase('tr-TR');
                    this.setSelectionRange(start, end);
                    searchTerm = this.value;
                    render();
                });

                document.getElementById('exportBtn').addEventListener('click', exportData);
                document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFileInput').click());
                document.getElementById('excelBtn').addEventListener('click', exportExcel);
                document.getElementById('importFileInput').addEventListener('change', function () {
                    if (this.files && this.files.length > 0) { importData(this.files[0]); this.value = ''; }
                });

                document.getElementById('listBtn').addEventListener('click', function () {
                    renderOverviewModal();
                    document.getElementById('listModal').classList.add('open');
                    lockBodyScroll();
                });
                document.getElementById('globalHistoryBtn').addEventListener('click', function () {
                    renderGlobalHistoryModal();
                    new bootstrap.Modal(document.getElementById('globalHistoryModal')).show();
                });
                document.getElementById('closeListBtn').addEventListener('click', function () {
                    document.getElementById('listModal').classList.remove('open');
                    unlockBodyScroll();
                });
                document.getElementById('listModal').addEventListener('click', function (e) {
                    if (e.target === this) { this.classList.remove('open'); unlockBodyScroll(); }
                });
                document.getElementById('listModalBody').addEventListener('click', function (e) {
                    const preview = e.target.closest('.note-preview-list');
                    document.querySelectorAll('.note-preview-list.expanded').forEach(el => {
                        if (el !== preview) el.classList.remove('expanded');
                    });
                    if (preview) { e.stopPropagation(); preview.classList.toggle('expanded'); }
                });
            }

            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
</html>
